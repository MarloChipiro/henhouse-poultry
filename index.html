<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller Workspace - Henhouse</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <style>
    :root {
      --brand: #815b12;
      --brand-deep: #34270d;
      --canvas: #f3f2ee;
      --surface: #ffffff;
      --border: #e2e0d8;
      --text: #24251f;
      --text-muted: #6e6d65;
    }
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: Inter, system-ui, -apple-system, sans-serif; 
      background: var(--canvas); 
      color: var(--text); 
      padding: 24px; 
    }

    /* Header */
    .catalog-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
    }
    .catalog-header h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--brand-deep); }
    .catalog-header p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 13px; }

    /* Modal Backdrop Overlay */
    .modal-overlay {
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      background: rgba(30, 26, 18, 0.55); 
      backdrop-filter: blur(3px);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 100;
    }
    .modal-overlay.hide { display: none !important; }

    /* Polished Modal Container */
    .modal-card {
      background: var(--surface);
      border-radius: 12px;
      width: min(520px, 92vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.22);
      border: 1px solid var(--border);
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--brand-deep); }
    .close-btn { 
      background: none; 
      border: none; 
      font-size: 20px; 
      cursor: pointer; 
      color: var(--text-muted); 
      padding: 4px 8px;
    }
    .close-btn:hover { color: var(--text); }

    /* Form Layout & Clean Input Styling */
    .modal-body { padding: 20px 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { 
      display: block; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--text-muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
    }
    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fafaf8;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(129, 91, 18, 0.15);
      background: #ffffff;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Buttons */
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex; 
      justify-content: flex-end; 
      gap: 10px; 
      background: #fafaf8;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .btn { 
      padding: 10px 18px; 
      border-radius: 6px; 
      font-size: 13px; 
      font-weight: 650; 
      cursor: pointer; 
      border: 1px solid var(--border); 
      transition: background 0.15s;
    }
    .btn-secondary { background: #ffffff; color: var(--text); }
    .btn-secondary:hover { background: #f3f2ee; }
    .btn-primary { background: var(--brand); color: #ffffff; border: none; }
    .btn-primary:hover { background: var(--brand-deep); }

    /* Product Cards Display Grid */
    .products-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
      gap: 16px; 
    }
    .product-card { 
      background: #ffffff; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      padding: 18px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
    }
    .product-card h4 { margin: 0 0 6px 0; font-size: 16px; font-weight: 700; color: var(--text); }
    .product-price { font-weight: 700; color: var(--brand); font-size: 16px; }
    .product-meta { font-size: 12px; color: var(--text-muted); margin-top: 8px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="catalog-header">
    <div>
      <h2>Product Catalog</h2>
      <p>Live marketplace items shared across all sellers</p>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Add listing</button>
  </div>

  <div id="productsList" class="products-grid">
    <!-- Real-time listings render here -->
  </div>

  <!-- Modal Component -->
  <div id="editModal" class="modal-overlay hide">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create Marketplace Listing</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <form id="listingForm">
        <div class="modal-body">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Dressed birds">Dressed birds</option>
              <option value="Live birds">Live birds</option>
              <option value="Eggs">Fresh farm eggs</option>
              <option value="Chicks">Chicks</option>
            </select>
          </div>

          <div class="form-group">
            <label for="title">Product Name</label>
            <input id="title" required placeholder="e.g., Fresh Broilers (2kg+)">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="price">Price (USD)</label>
              <input id="price" type="number" step="0.01" required placeholder="0.00">
            </div>
            <div class="form-group">
              <label for="quantity">Available Quantity</label>
              <input id="quantity" type="number" required placeholder="0">
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="3" placeholder="Add details customers should know (location, delivery terms...)"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Publish Listing</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const supabase = (window.supabase && window.HENHOUSE_SUPABASE_URL) 
      ? window.supabase.createClient(window.HENHOUSE_SUPABASE_URL, window.HENHOUSE_SUPABASE_ANON_KEY)
      : null;

    function openModal() { document.getElementById('editModal').classList.remove('hide'); }
    function closeModal() { document.getElementById('editModal').classList.add('hide'); }

    // Render products list onto screen
    function renderProducts(products) {
      const container = document.getElementById('productsList');
      if (!products || products.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); grid-column: 1/-1;">No listings available yet. Click "+ Add listing" to publish the first item!</p>`;
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <h4>${p.title}</h4>
          <div class="product-price">$${Number(p.price).toFixed(2)}</div>
          <div class="product-meta">Category: ${p.category} | Stock: ${p.quantity} units</div>
          <p style="font-size:12px; margin:10px 0 0 0; color:#444; line-height: 1.5;">${p.description || 'No description provided.'}</p>
        </div>
      `).join('');
    }

    // Load initial listings from Supabase
    async function loadProducts() {
      if (!supabase) return;
      const { data, error } = await supabase
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });
      if (!error) renderProducts(data);
    }

    // Subscribe to live database updates across all devices
    function setupRealtime() {
      if (!supabase) return;
      supabase
        .channel('public:products')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
          loadProducts();
        })
        .subscribe();
    }

    // Submit form and publish listing
    document.getElementById('listingForm').onsubmit = async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      const newProduct = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        price: parseFloat(document.getElementById('price').value),
        quantity: parseInt(document.getElementById('quantity').value),
        description: document.getElementById('description').value
      };

      if (supabase) {
        const { error } = await supabase.from('products').insert([newProduct]);
        if (error) {
          alert("Error publishing listing: " + error.message);
        } else {
          closeModal();
          document.getElementById('listingForm').reset();
        }
      }
      saveBtn.disabled = false;
    };

    loadProducts();
    setupRealtime();
  </script>
</body>
</html>
